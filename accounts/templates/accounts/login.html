{% extends 'base.html' %}

{% block title %}
<div class="h1">Login</div>
{% endblock %}
{% block content %}
{% include 'includes/demo_credentials.html' %}
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    {{ field.label }}
    {{ field }}
    {{ field.errors }}
    <br>
    {% endfor %}
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">ログイン</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">ホームへ</a>
    </div>
</form>
{% endblock %}
