services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    init: true
    working_dir: /workspaces/TestCreator
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    volumes:
      - ..:/workspaces/TestCreator
      - node_modules:/workspaces/TestCreator/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    env_file:
      - ../.env
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
  node_modules:
