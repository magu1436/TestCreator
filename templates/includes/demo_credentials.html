{% if demo_mode %}
<section class="alert alert-info m-3" aria-label="デモの共有ログイン情報">
    <p>共有アカウントで通常のログインフォームからログインしてください。</p>
    <dl class="mb-0"><dt>ユーザー名</dt><dd>{{ demo_username }}</dd><dt>パスワード</dt><dd>{{ demo_password }}</dd></dl>
    <a href="{% url 'accounts:login' %}">ログイン画面へ</a>
</section>
{% endif %}
